name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fails in about a minute when the tag or the updater secrets are wrong, before the long builds start.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak sama dengan versi aplikasi v${version}"
            exit 1
          fi
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Updater signing secrets must work
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} kosong atau belum dibuat"
              exit 1
            fi
          done
          echo probe > "$RUNNER_TEMP/probe.txt"
          if ! output=$(pnpm -s tauri signer sign "$RUNNER_TEMP/probe.txt" 2>&1); then
            echo "::error::Kunci updater tidak bisa dipakai: $(printf '%s' "$output" | tail -n 1)"
            exit 1
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them; see README.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Zorp ${{ github.ref_name }}
          releaseBody: |
            Installer belum ditandatangani (unsigned). Lihat README untuk cara membukanya di macOS dan Windows.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Headless command-line runner for CI, without the webview or the system keychain.
  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            file: zorp-cli
          - platform: macos-latest
            target: x86_64-apple-darwin
            file: zorp-cli
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            file: zorp-cli.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            file: zorp-cli
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cli-${{ matrix.target }}
      - name: Build zorp-cli
        working-directory: src-tauri
        run: cargo build --release --no-default-features --bin zorp-cli --target ${{ matrix.target }}
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="zorp-cli-${{ matrix.target }}${{ matrix.file == 'zorp-cli.exe' && '.exe' || '' }}"
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.file }}" "$name"
          gh release upload "${GITHUB_REF_NAME}" "$name" --clobber
