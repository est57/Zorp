[package]
name = "zorp"
version = "0.1.0"
description = "Desktop API client"
authors = ["Zorp"]
edition = "2024"

[lib]
name = "zorp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "form", "gzip", "brotli", "deflate", "charset", "http2", "cookies", "socks"] }
url = "2.5.8"
tauri-plugin-dialog = "2.8.3"
base64 = "0.23.1"
keyring = "4.2.0"
tokio = { version = "1.53.3", features = ["sync", "macros", "net", "io-util", "time"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
tauri-plugin-opener = "2.7.2"
cookie_store = "0.22.1"
tower-layer = "0.3.3"
tower-service = "0.3.3"
rquickjs = "0.14.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
